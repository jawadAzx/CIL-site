name: Weekly SEO cadence

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-and-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run seo:check
      - run: npm run build
      - run: npm run seo:brief
      - name: Create this week's content brief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(head -n 1 seo-weekly-brief.md | sed 's/^# //')
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body-file seo-weekly-brief.md --label seo 2>/dev/null || gh issue create --title "$title" --body-file seo-weekly-brief.md
          fi
